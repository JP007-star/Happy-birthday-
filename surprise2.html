<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise 2 - Your Gift 🌅</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Quicksand:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(160deg, #1a0e26 0%, #0d0818 100%);
  min-height:100vh;
  font-family:'Quicksand',sans-serif;
  color:#f5e6d0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem 1rem;
}

/* Back button */
.back-btn {
  position:fixed;
  top:1.5rem;
  left:1.5rem;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,233,160,.2);
  color:#f5e6d0;
  padding:0.6rem 1.2rem;
  border-radius:25px;
  cursor:pointer;
  font-family:'Quicksand',sans-serif;
  font-size:0.8rem;
  letter-spacing:0.1em;
  text-decoration:none;
  transition:all .3s ease;
  z-index:100;
}
.back-btn:hover {
  background:rgba(255,233,160,.15);
  transform:translateX(-3px);
}

.title {
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  font-size:clamp(1rem,3vw,1.4rem);
  color:rgba(255,230,180,.6);
  letter-spacing:.2em;
  text-transform:uppercase;
  margin-bottom:.5rem;
}

.subtitle {
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.8rem,6vw,3rem);
  font-weight:300;
  color:#ffe9a0;
  text-align:center;
  margin-bottom:2rem;
}

.pdf-container {
  max-width:800px;
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(212,160,240,.2);
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 15px50px rgba(0,0,0,.3);
}
iframe {
  width:100%;
  height:600px;
  border:none;
  display:block;
}

.hint {
  font-family:'Cormorant Garamond',serif;
  font-style:italic;
  color:rgba(212,169,106,.7);
  margin-top:1.5rem;
  font-size:1.1rem;
}
</style>
</head>
<body>

<a href="index.html" class="back-btn">← Back to Birthday</a>

<p class="title">✦ Surprise 2 ✦</p>
<h1 class="subtitle">Something Special For You 🌅</h1>

<div class="pdf-container">
  <iframe src="Promotion_Letter_Nandini-1.pdf"></iframe>
</div>

<p class="hint">📥 Click the download icon in the viewer to save it</p>

</body>
</html>
